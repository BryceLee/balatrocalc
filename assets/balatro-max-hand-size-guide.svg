<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Balatro max hand size guide</title>
  <desc id="desc">Balatro starts with 8 cards in hand, Painted Deck starts with 10, and the source has no fixed upper cap.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#244142"/><stop offset="1" stop-color="#071113"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#d9eee8" stroke-opacity=".04"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="630" rx="28" fill="url(#grid)"/>
  <path d="M0 6H1200" stroke="#6fe0ae" stroke-width="12"/>

  <text x="64" y="75" fill="#6fe0ae" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="3">BALATROCALC · SOURCE LAB</text>
  <text x="64" y="145" fill="#fff8dc" font-family="Arial, sans-serif" font-size="58" font-weight="700">Balatro Max Hand Size</text>
  <text x="64" y="188" fill="#bdcfca" font-family="Arial, sans-serif" font-size="23">Default, every modifier, and the actual source-code limit</text>

  <g transform="translate(74 275)">
    <rect width="254" height="188" rx="14" fill="#081416" stroke="#63bff2" stroke-opacity=".34"/>
    <text x="24" y="40" fill="#9fb4af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2">DEFAULT</text>
    <text x="24" y="130" fill="#ffe3a0" font-family="Arial, sans-serif" font-size="102" font-weight="700">8</text>
    <text x="142" y="126" fill="#63bff2" font-family="Arial, sans-serif" font-size="22">cards</text>
    <text x="24" y="164" fill="#9fb4af" font-family="Arial, sans-serif" font-size="16">normal decks</text>
  </g>
  <g transform="translate(350 275)">
    <rect width="254" height="188" rx="14" fill="#081416" stroke="#f2bd4b" stroke-opacity=".34"/>
    <text x="24" y="40" fill="#9fb4af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2">PAINTED DECK</text>
    <text x="24" y="130" fill="#ffe3a0" font-family="Arial, sans-serif" font-size="102" font-weight="700">10</text>
    <text x="154" y="126" fill="#63bff2" font-family="Arial, sans-serif" font-size="22">cards</text>
    <text x="24" y="164" fill="#9fb4af" font-family="Arial, sans-serif" font-size="16">8 base + 2 deck effect</text>
  </g>

  <g transform="translate(674 247)">
    <circle cx="190" cy="126" r="119" fill="#081416" stroke="#6fe0ae" stroke-opacity=".5"/>
    <circle cx="190" cy="126" r="94" fill="none" stroke="#6fe0ae" stroke-opacity=".12" stroke-width="10"/>
    <text x="190" y="83" fill="#9fb4af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="middle" letter-spacing="2">FIXED CODE CAP</text>
    <text x="190" y="146" fill="#6fe0ae" font-family="Arial, sans-serif" font-size="48" font-weight="700" text-anchor="middle" filter="url(#glow)">NONE</text>
    <text x="190" y="183" fill="#bdcfca" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">practical max varies by run</text>
    <path d="M309 126H432" stroke="#f2bd4b" stroke-width="2" stroke-dasharray="5 6"/>
    <text x="510" y="112" fill="#ffe3a0" font-family="Arial, sans-serif" font-size="18" text-anchor="end">max(0, current + Δ)</text>
    <text x="510" y="139" fill="#9fb4af" font-family="Arial, sans-serif" font-size="15" text-anchor="end">zero floor · no upper clamp</text>
  </g>

  <g transform="translate(65 515)" font-family="Arial, sans-serif" font-size="17">
    <rect width="1070" height="68" rx="11" fill="#081416" fill-opacity=".72" stroke="#d9eee8" stroke-opacity=".1"/>
    <circle cx="30" cy="34" r="6" fill="#6fe0ae"/><text x="47" y="40" fill="#bdcfca">Decks</text>
    <circle cx="142" cy="34" r="6" fill="#6fe0ae"/><text x="159" y="40" fill="#bdcfca">Jokers</text>
    <circle cx="264" cy="34" r="6" fill="#6fe0ae"/><text x="281" y="40" fill="#bdcfca">Vouchers</text>
    <circle cx="410" cy="34" r="6" fill="#6fe0ae"/><text x="427" y="40" fill="#bdcfca">Tags</text>
    <circle cx="506" cy="34" r="6" fill="#ff7971"/><text x="523" y="40" fill="#bdcfca">Spectral penalties</text>
    <text x="1038" y="40" fill="#f2bd4b" text-anchor="end">INTERACTIVE BUILDER →</text>
  </g>
</svg>
